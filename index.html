<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Play out a full Premier League season by hand — enter every score and goalscorer, build the table, chase the title.">
<meta name="theme-color" content="#38125c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140821" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Title Race">
<title>Title Race — EPL Season Simulator</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2338125c'/%3E%3Crect x='20' y='58' width='16' height='26' rx='4' fill='%23ffc83c'/%3E%3Crect x='42' y='42' width='16' height='42' rx='4' fill='%23ffc83c'/%3E%3Crect x='64' y='22' width='16' height='62' rx='4' fill='%23ffc83c'/%3E%3C/svg%3E">

<style>
/* ============================================================
   1. DESIGN TOKENS — purple/gold, distinct from Pitch Perfect's
   green so the two apps never get confused on a home screen.
   ============================================================ */
:root{
  --bg:            #f4f2fb;
  --surface:       #ffffff;
  --surface-2:     #f7f5fc;
  --border:        #e1dcef;
  --ink:            #211533;
  --ink-2:         #5a4f71;
  --ink-3:         #8d84a1;

  --accent:        #5b1d9e;
  --accent-ink:    #ffffff;
  --accent-soft:   #ece3f8;
  --accent-line:   #d2bdee;

  --gold:          #a66a06;
  --gold-soft:     #fbf0db;

  --good:          #0a7d3c;
  --bad:           #b3261e;
  --bad-soft:      #fdecea;

  --cl:            #1d6fd1;      /* Champions League zone */
  --cl-soft:       #e5f0fc;
  --rel:           #b3261e;      /* relegation zone */
  --rel-soft:      #fdecea;

  --shadow:        0 1px 2px rgba(33,21,51,.06), 0 8px 24px rgba(33,21,51,.08);
  --shadow-lg:     0 12px 40px rgba(33,21,51,.2);

  --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
  --nav-h: 64px; --maxw: 760px;
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:          #140821;
    --surface:     #1d1030;
    --surface-2:   #261a3c;
    --border:      #362a4d;
    --ink:         #f1ecf9;
    --ink-2:       #b6a9cd;
    --ink-3:       #8a7ea1;

    --accent:      #a873e8;
    --accent-ink:  #1c0b31;
    --accent-soft: #2c1c4720;
    --accent-line: #513a73;

    --gold:        #e8b545;
    --gold-soft:   #2a2213;

    --good:        #35c46f;
    --bad:         #ff8a80;
    --bad-soft:    #3a1d1a;

    --cl:          #6fa8f0;
    --cl-soft:     #17233a;
    --rel:         #ff8a80;
    --rel-soft:    #3a1d1a;

    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:   0 12px 40px rgba(0,0,0,.55);
  }
}

/* ============================================================
   2. BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  line-height:1.5; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
button,input,select{ font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
button{ cursor:pointer; border:none; background:none; }
h1,h2,h3{ margin:0; line-height:1.2; letter-spacing:-.02em; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }

/* ============================================================
   3. APP SHELL
   ============================================================ */
.app-header{
  position:sticky; top:0; z-index:20;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.app-header .wrap{ max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:10px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; }
.brand .bars{
  width:30px; height:30px; border-radius:9px; background:var(--accent);
  display:flex; align-items:flex-end; justify-content:center; gap:3px; padding:5px 5px 4px;
}
.brand .bars span{ width:4px; background:var(--gold); border-radius:2px; }
.brand .bars span:nth-child(1){ height:40%; } .brand .bars span:nth-child(2){ height:70%; } .brand .bars span:nth-child(3){ height:100%; }
.md-pill{
  margin-left:auto; display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
  font-size:13px; font-weight:700; white-space:nowrap;
}

main{ max-width:var(--maxw); margin:0 auto; padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px); }
.view[hidden]{ display:none; }
.view{ animation:rise .28s ease both; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; justify-content:center; gap:8px;
  padding:6px 16px calc(env(safe-area-inset-bottom) + 6px);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--border);
}
.tabbar button{
  flex:1; max-width:260px; min-height:52px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-radius:14px; color:var(--ink-3); font-size:12px; font-weight:700;
  transition:background .18s, color .18s;
}
.tabbar button .ico{ font-size:21px; line-height:1; }
.tabbar button[aria-selected="true"]{ color:var(--accent); background:var(--accent-soft); }
.tabbar button:active{ transform:scale(.97); }

/* ============================================================
   4. GENERIC PIECES
   ============================================================ */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:20px; }
.section-title{
  display:flex; align-items:baseline; gap:8px; margin:26px 4px 12px;
  font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
}
.btn{
  min-height:52px; padding:0 22px; border-radius:14px; font-weight:800; font-size:16px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s, opacity .18s, background .18s;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); width:100%; }
.btn-primary:disabled{ opacity:.45; }
.btn-ghost{ background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border); min-height:46px; font-size:14px; padding:0 16px; }
.btn-ghost:disabled{ opacity:.5; }
.empty{ text-align:center; padding:38px 20px; color:var(--ink-3); font-weight:600; }

.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:14px 12px; text-align:center; }
.tile .n{ font-size:26px; font-weight:800; letter-spacing:-.03em; display:block; }
.tile .l{ font-size:11px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; }

.grp-legend{ font-size:11px; color:var(--ink-3); font-weight:600; margin-top:12px; }

/* Search */
.search-wrap{ position:relative; }
.search-wrap::before{ content:"🔍"; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.55; pointer-events:none; }
.search{
  width:100%; min-height:52px; padding:0 16px 0 42px; font-size:17px; border-radius:14px;
  border:2px solid var(--border); background:var(--surface);
}
.search:focus{ outline:none; border-color:var(--accent); }
.sim-hits{ display:grid; gap:8px; margin-bottom:14px; }
.sim-hit{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:13px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow);
}
.sim-hit:active{ transform:scale(.985); border-color:var(--accent); }
.sim-hit .crest{ font-size:22px; flex:0 0 auto; }
.hit-main{ min-width:0; flex:1; }
.hit-name{ display:block; font-size:15px; font-weight:800; }
.hit-sub{ display:block; font-size:12px; font-weight:600; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hit-fav{ display:block; margin-top:3px; }
.wc-caret{ color:var(--ink-3); font-size:20px; flex:0 0 auto; }

/* ============================================================
   5. LEAGUE TABLE
   ============================================================ */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r-md); border:1px solid var(--border); }
.lg-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
.lg-table th{
  text-align:center; font-size:10px; font-weight:800; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.04em; padding:10px 6px; background:var(--surface-2); position:sticky; top:0;
}
.lg-table th:nth-child(2){ text-align:left; padding-left:12px; }
.lg-table td{ padding:10px 6px; text-align:center; border-top:1px solid var(--border); background:var(--surface); font-weight:700; }
.lg-table tr.zone-cl td:first-child{ box-shadow:inset 3px 0 0 var(--cl); }
.lg-table tr.zone-rel td:first-child{ box-shadow:inset 3px 0 0 var(--rel); }
.lg-pos{ color:var(--ink-3); font-weight:800; }
.lg-team{ text-align:left !important; padding-left:12px !important; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.lg-team button{ display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); }
.lg-pts{ color:var(--accent); font-weight:800; }
.lg-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; font-weight:700; color:var(--ink-2); }
.lg-legend span{ display:inline-flex; align-items:center; gap:6px; }
.lg-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

/* ============================================================
   6. FIXTURES / SCORE ENTRY
   ============================================================ */
.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; min-height:42px; padding:0 16px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-2); font-size:14px; font-weight:700; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
}
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.chip.played{ box-shadow:inset 0 0 0 1.5px var(--good); }

.match-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  box-shadow:var(--shadow); padding:14px; margin-bottom:12px;
}
.match-card.locked{ border-color:var(--gold); background:linear-gradient(180deg,var(--gold-soft),var(--surface) 65%); }
.match-row{ display:grid; grid-template-columns:1fr auto auto auto 1fr; align-items:center; gap:7px; }
.m-team{ display:flex; align-items:center; gap:7px; min-width:0; font-size:13.5px; font-weight:700; }
.m-team.right{ justify-content:flex-end; text-align:right; }
.m-team .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m-team:active{ opacity:.7; }
.sc{
  width:44px; min-height:44px; text-align:center; font-size:17px; font-weight:800;
  border-radius:10px; border:2px solid var(--border); background:var(--surface-2); padding:0;
  -moz-appearance:textfield;
}
.sc::-webkit-outer-spin-button,.sc::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.sc:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
.sc:disabled{ opacity:.65; }
.sc-sep{ color:var(--ink-3); font-weight:800; }

.scorer-sec{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
.scorer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
.scorer-head .lbl{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); }
.scorer-head .tally{ font-size:11px; font-weight:700; color:var(--ink-2); }
.scorer-head .tally.off{ color:var(--gold); }
.scorer-cols{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.scorer-list{ display:flex; flex-wrap:wrap; gap:6px; min-height:28px; margin-bottom:8px; }
.scorer-chip{
  display:inline-flex; align-items:center; gap:5px; padding:5px 6px 5px 10px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  font-size:12px; font-weight:700; max-width:100%;
}
.scorer-chip .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
.scorer-chip button{ font-size:13px; line-height:1; padding:2px; opacity:.7; flex:0 0 auto; }
.add-scorer-btn{
  width:100%; min-height:38px; border-radius:10px; border:1.5px dashed var(--border);
  color:var(--ink-3); font-size:12px; font-weight:700; background:var(--surface-2);
}
.add-scorer-btn:disabled{ opacity:.5; }

.match-foot{ display:flex; align-items:center; gap:10px; margin-top:12px; }
.match-foot .btn{ flex:1; min-height:44px; font-size:14px; }
.lock-note{
  flex:1; display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--gold);
}

/* Picker sheet for choosing a goalscorer */
.pick-list{ display:grid; gap:6px; margin-top:12px; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.pick-row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 12px;
  background:var(--surface-2); border:1px solid var(--border); border-radius:12px; font-size:14px; font-weight:700;
}
.pick-row:active{ background:var(--accent-soft); border-color:var(--accent); }
.pick-row .num{
  width:26px; height:26px; border-radius:7px; background:var(--surface); border:1px solid var(--border);
  display:grid; place-items:center; font-size:11px; font-weight:800; color:var(--ink-3); flex:0 0 auto;
}

/* ============================================================
   7. SQUAD TILES
   ============================================================ */
.team-hero{ text-align:center; }
.team-hero .crest-big{ font-size:44px; line-height:1; margin-bottom:6px; }
.stand-tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:14px; margin-bottom:12px; }
.stand-tile .al{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin-bottom:8px; }
.stand-nums{ display:flex; flex-wrap:wrap; gap:12px; font-size:13px; font-weight:600; color:var(--ink-2); }
.stand-nums b{ font-size:17px; font-weight:800; color:var(--ink); margin-right:3px; }
.stand-nums .pts b{ color:var(--accent); }
.res-line{ display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 0; }
.res-line .r{ font-weight:800; min-width:56px; font-size:11px; text-transform:uppercase; color:var(--ink-3); }
.res-line .o{ flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.res-line .s{ font-weight:800; }
.res-line .s.w{ color:var(--good); } .res-line .s.l{ color:var(--bad); }

.fav-chip{
  display:inline-block; margin:0 0 14px; padding:7px 13px; border-radius:999px;
  background:var(--bad-soft); color:var(--bad); border:1px solid color-mix(in srgb, var(--bad) 32%, transparent);
  font-size:13px; font-weight:800;
}
.p-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:6px; }
@media(min-width:560px){ .p-grid{ grid-template-columns:repeat(3,1fr); } }
@media(min-width:820px){ .p-grid{ grid-template-columns:repeat(4,1fr); } }
.p-tile{ position:relative; padding:12px 12px 12px 42px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); min-height:84px; }
.p-tile.is-fav{ border-color:var(--bad); background:linear-gradient(180deg, var(--bad-soft), var(--surface) 60%); }
.p-num{
  position:absolute; left:9px; top:11px; width:26px; height:26px; border-radius:8px;
  display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
  font-size:11px; font-weight:800;
}
.p-pos{ position:absolute; left:9px; top:42px; width:26px; text-align:center; font-size:9px; font-weight:800; letter-spacing:.03em; color:var(--ink-3); }
.p-pos.GK{ color:var(--gold); }
.p-fav{
  position:absolute; right:4px; top:4px; width:38px; height:38px; display:grid; place-items:center;
  font-size:19px; line-height:1; color:var(--ink-3); border-radius:10px; transition:transform .15s, color .15s;
}
.p-fav.on{ color:var(--bad); }
.p-fav:active{ transform:scale(1.25); }
.p-name{ font-size:13.5px; font-weight:800; line-height:1.25; padding-right:34px; }
.p-meta{ font-size:11px; font-weight:600; color:var(--ink-2); margin-top:3px; }
.p-country{ font-size:11px; font-weight:600; color:var(--ink-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ============================================================
   8. SHEET MODAL
   ============================================================ */
.sheet-scrim{
  position:fixed; inset:0; z-index:60; background:rgba(16,6,28,.5);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease both;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  width:100%; max-width:var(--maxw); max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--surface); border-radius:26px 26px 0 0; box-shadow:var(--shadow-lg);
  padding:10px 20px calc(env(safe-area-inset-bottom) + 26px); animation:slideup .3s cubic-bezier(.2,.8,.2,1) both;
}
@media(min-width:620px){ .sheet-scrim{ align-items:center; } .sheet{ border-radius:26px; max-height:82vh; } }
@keyframes slideup{ from{ transform:translateY(100%);} to{ transform:none;} }
.grabber{ width:44px; height:5px; border-radius:3px; background:var(--border); margin:0 auto 16px; }
.sheet h2{ font-size:24px; }
.sheet .host{ color:var(--ink-2); font-weight:700; font-size:14px; margin:4px 0 16px; }
.sheet .btn-ghost{ width:100%; margin-top:16px; }
.eyebrow{ font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); }

/* ============================================================
   9. UPDATE TOAST
   ============================================================ */
.update-bar{
  position:fixed; left:12px; right:12px; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index:45;
  max-width:calc(var(--maxw) - 24px); margin:0 auto; display:flex; align-items:center; gap:10px;
  padding:12px 12px 12px 16px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
  box-shadow:var(--shadow-lg); animation:rise .3s ease both;
}
.update-bar[hidden]{ display:none; }
.update-bar .msg{ flex:1; font-size:14px; font-weight:700; }
.update-bar button{ min-height:40px; padding:0 14px; border-radius:11px; font-size:14px; font-weight:800; background:var(--accent-ink); color:var(--accent); }
.update-bar button.x{ min-width:40px; padding:0; background:transparent; color:var(--accent-ink); font-size:17px; opacity:.85; }

@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>

<body>

<header class="app-header">
  <div class="wrap">
    <div class="brand"><span class="bars"><span></span><span></span><span></span></span> Title Race</div>
    <div class="md-pill" id="mdPill">MD <span id="mdNum">1</span>/38</div>
  </div>
</header>

<main>
  <!-- ========== VIEW 1: FIXTURES ========== -->
  <section class="view" id="view-fixtures" role="tabpanel" aria-label="Fixtures">
    <div class="search-wrap">
      <input class="search" id="teamSearch" type="search" autocomplete="off"
             placeholder="Search a club…" aria-label="Search club">
    </div>
    <div id="searchResults"></div>

    <div class="chips" id="mdChips" role="group" aria-label="Matchday" style="margin-top:12px"></div>
    <div id="fixtureList" style="margin-top:12px"></div>
  </section>

  <!-- ========== VIEW 2: TABLE ========== -->
  <section class="view" id="view-table" role="tabpanel" aria-label="League Table" hidden>
    <h2 class="section-title" style="margin-top:4px">Premier League</h2>
    <div id="tableBody"></div>
    <button class="btn btn-ghost" id="resetBtn" style="width:100%; margin-top:18px">Reset season</button>

/* ==================================================================
   B. STORE — state management
   ------------------------------------------------------------------
   Same adapter pattern as the companion app: an async wrapper around
   localStorage, so swapping in a cloud database later for cross-device
   sync is a single Store.use({...}) call — nothing else changes.
   ================================================================== */
const Store = (function () {
  const KEY = "titlerace:v1";

  const DEFAULTS = {
    version: 1,
    // One entry per played/entered fixture, keyed by its index in FIXTURES.
    // { hs, as: scores; scorers: [{side:"h"|"a", name}]; lockedUntil: ms|null }
    results: {},
    // One favourite player per club: { "Arsenal": "Bukayo Saka", ... }
    favPlayers: {}
  };

  const clone = obj => JSON.parse(JSON.stringify(obj));

  const LocalAdapter = {
    async load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
      catch { return null; }
    },
    async save(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch { /* storage full or blocked — app still works in-memory */ }
    }
  };

  let adapter = LocalAdapter;
  let state = clone(DEFAULTS);
  const listeners = new Set();
  function notify() { listeners.forEach(fn => fn(state)); }

  return {
    use(newAdapter) { adapter = newAdapter; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    get() { return state; },

    async init() {
      const saved = await adapter.load();
      if (saved && typeof saved === "object") {
        state = { ...clone(DEFAULTS), ...saved,
                  results:    { ...(saved.results || {}) },
                  favPlayers: { ...(saved.favPlayers || {}) } };
      }
      notify();
      return state;
    },

    async update(mutator) {
      mutator(state);
      await adapter.save(state);
      notify();
      return state;
    }
  };
})();

const $ = sel => document.querySelector(sel);

/** Age in whole years from a YYYY-MM-DD date of birth, as of today. */
function ageFrom(dob) {
  if (!dob) return null;
  const [y, m, d] = dob.split("-").map(Number);
  const now = new Date();
  let age = now.getFullYear() - y;
  const mo = now.getMonth() + 1;
  if (mo < m || (mo === m && now.getDate() < d)) age--;
  return age;
}

/** Lowercase, strip accents/punctuation, collapse spaces — for search. */
function normalise(s) {
  return String(s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

const TEAMS = Object.keys(SQUADS).sort();


/* ==================================================================
   D. SEASON — fixtures, scoring, the lock, and the table
   ================================================================== */
const Season = (function () {
  const LOCK_MS = 3 * 60 * 1000;        // 3 minutes
  let md = 1;                           // active matchday (1-38)
  let openPicker = null;                // {fi, side} while a scorer picker sheet is open
  let tick = null;

  const res = () => Store.get().results;
  const favOf = team => Store.get().favPlayers[team] || null;

  /** Every fixture index for a given matchday. */
  function fixturesFor(matchday) {
    const out = [];
    FIXTURES.forEach((f, i) => { if (f.md === matchday) out.push(i); });
    return out;
  }

  function isPlayed(fi) {
    const r = res()[fi];
    return !!r && r.hs !== null && r.hs !== undefined && r.as !== null && r.as !== undefined;
  }

  function isLocked(fi) {
    const r = res()[fi];
    return !!r && !!r.lockedUntil && r.lockedUntil > Date.now();
  }

  function lockRemaining(fi) {
    const r = res()[fi];
    return r && r.lockedUntil ? Math.max(0, r.lockedUntil - Date.now()) : 0;
  }

  const fmtClock = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  /** Full league table from every entered result — pts, then GD, then GF, then name. */
  function table() {
    const rows = {};
    TEAMS.forEach(t => { rows[t] = { team: t, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 }; });
    FIXTURES.forEach((f, i) => {
      if (!isPlayed(i)) return;
      const r = res()[i];
      const H = rows[f.h], A = rows[f.a];
      H.p++; A.p++; H.gf += r.hs; H.ga += r.as; A.gf += r.as; A.ga += r.hs;
      if (r.hs > r.as)      { H.w++; H.pts += 3; A.l++; }
      else if (r.hs < r.as) { A.w++; A.pts += 3; H.l++; }
      else                  { H.d++; A.d++; H.pts++; A.pts++; }
    });
    return Object.values(rows).sort((a, b) =>
      b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || a.team.localeCompare(b.team));
  }

  function teamRow(team) { return table().find(r => r.team === team); }

  /** Every result a team has, newest matchday first, from that team's view. */
  function teamResults(team) {
    const out = [];
    FIXTURES.forEach((f, i) => {
      if (f.h !== team && f.a !== team) return;
      if (!isPlayed(i)) return;
      const r = res()[i];
      const home = f.h === team;
      const gf = home ? r.hs : r.as, ga = home ? r.as : r.hs;
      out.push({
        md: f.md, opponent: home ? f.a : f.h, venue: home ? "H" : "A",
        score: `${gf}–${ga}`, won: gf > ga ? true : (gf === ga ? null : false)
      });
    });
    return out.sort((a, b) => b.md - a.md);
  }

  /* ---------- scoring UI ---------- */

  function setScore(fi, side, value) {
    const v = value === "" ? null : Math.max(0, Math.min(99, parseInt(value, 10)));
    return Store.update(s => {
      const cur = s.results[fi] || { hs: null, as: null, scorers: [], lockedUntil: null };
      cur[side] = (value === "" || isNaN(v)) ? null : v;
      s.results[fi] = cur;
    });
  }

  function addScorer(fi, side, name) {
    return Store.update(s => {
      const cur = s.results[fi] || { hs: null, as: null, scorers: [], lockedUntil: null };
      cur.scorers = cur.scorers || [];
      cur.scorers.push({ side, name });
      s.results[fi] = cur;
    });
  }

  function removeScorer(fi, idx) {
    return Store.update(s => {
      const cur = s.results[fi];
      if (cur && cur.scorers) cur.scorers.splice(idx, 1);
    });
  }

  function saveScore(fi) {
    return Store.update(s => {
      const cur = s.results[fi];
      if (!cur || cur.hs === null || cur.as === null) return;
      cur.lockedUntil = Date.now() + LOCK_MS;
    }).then(() => { runTick(); renderFixtures(); });
  }

  function runTick() {
    stopTick();
    tick = setInterval(() => {
      let anyLocked = false;
      document.querySelectorAll(".lock-clock").forEach(el => {
        const fi = Number(el.dataset.fi);
        const left = lockRemaining(fi);
        if (left > 0) { el.textContent = fmtClock(left); anyLocked = true; }
        else { renderFixtures(); }
      });
      if (!anyLocked) stopTick();
    }, 500);
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }

  /* ---------- rendering: fixtures ---------- */

  function matchCard(fi) {
    const f = FIXTURES[fi];
    const r = res()[fi] || { hs: null, as: null, scorers: [] };
    const locked = isLocked(fi);
    const scorers = r.scorers || [];
    const hGoals = scorers.filter(x => x.side === "h").length;
    const aGoals = scorers.filter(x => x.side === "a").length;
    const expected = (r.hs || 0) + (r.as || 0);
    const attributed = hGoals + aGoals;

    const chip = (s, i) => `
      <span class="scorer-chip">
        <span class="nm">${s.name}</span>
        <button data-rm="${i}" data-fi="${fi}" aria-label="Remove ${s.name}" ${locked ? "disabled" : ""}>✕</button>
      </span>`;

    return `
      <div class="match-card ${locked ? "locked" : ""}" data-fi="${fi}">
        <div class="match-row">
          <button class="m-team" data-team="${f.h}"><span class="nm">${f.h}</span></button>
          ${numInput(fi, "hs", r.hs, locked, f.h)}
          <span class="sc-sep">–</span>
          ${numInput(fi, "as", r.as, locked, f.a)}
          <button class="m-team right" data-team="${f.a}"><span class="nm">${f.a}</span></button>
        </div>

        <div class="scorer-sec">
          <div class="scorer-head">
            <span class="lbl">⚽ Goalscorers</span>
            ${expected > 0 ? `<span class="tally ${attributed !== expected ? "off" : ""}">${attributed}/${expected} attributed</span>` : ""}
          </div>
          <div class="scorer-cols">
            <div>
              <div class="scorer-list">${scorers.filter(s=>s.side==="h").map((s,i)=>chip(s, scorers.indexOf(s))).join("")}</div>
              <button class="add-scorer-btn" data-pick="h" data-fi="${fi}" ${locked ? "disabled" : ""}>+ ${f.h} scorer</button>
            </div>
            <div>
              <div class="scorer-list">${scorers.filter(s=>s.side==="a").map((s,i)=>chip(s, scorers.indexOf(s))).join("")}</div>
              <button class="add-scorer-btn" data-pick="a" data-fi="${fi}" ${locked ? "disabled" : ""}>+ ${f.a} scorer</button>
            </div>
          </div>
        </div>

        <div class="match-foot">
          ${locked
            ? `<span class="lock-note">🔒 Saved — editable in <span class="lock-clock" data-fi="${fi}">${fmtClock(lockRemaining(fi))}</span></span>`
            : `<button class="btn btn-primary" data-save="${fi}" ${r.hs===null||r.as===null?"disabled":""}>💾 Save score</button>`}
        </div>
      </div>`;
  }

  const numInput = (fi, side, val, locked, label) =>
    `<input class="sc" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="99"
            value="${val === null || val === undefined ? "" : val}"
            data-fi="${fi}" data-side="${side}" aria-label="${label} goals" ${locked ? "disabled" : ""}>`;

  function renderChips() {
    $("#mdChips").innerHTML = Array.from({ length: 38 }, (_, i) => i + 1).map(n => {
      const fis = fixturesFor(n);
      const played = fis.length && fis.every(isPlayed);
      return `<button class="chip ${played ? "played" : ""}" data-md="${n}" aria-pressed="${md === n}">MD ${n}${played ? " ✓" : ""}</button>`;
    }).join("");
    $("#mdNum").textContent = md;
  }

  function renderFixtures() {
    renderChips();
    const fis = fixturesFor(md);
    $("#fixtureList").innerHTML = fis.map(matchCard).join("");
    runTick();
  }

  /* ---------- rendering: table ---------- */

  function renderTable() {
    const rows = table();
    const body = $("#tableBody");
    body.innerHTML = `
      <div class="table-wrap">
        <table class="lg-table">
          <thead><tr>
            <th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
          </tr></thead>
          <tbody>
            ${rows.map((r, i) => {
              const pos = i + 1;
              const zone = pos <= 4 ? "zone-cl" : (pos >= 18 ? "zone-rel" : "");
              const fav = favOf(r.team);
              return `
              <tr class="${zone}">
                <td class="lg-pos">${pos}</td>
                <td class="lg-team"><button data-team="${r.team}">${fav ? "♥ " : ""}${r.team}</button></td>
                <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
                <td>${r.gf}</td><td>${r.ga}</td><td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td>
                <td class="lg-pts">${r.pts}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="lg-legend">
        <span><i style="background:var(--cl)"></i> Champions League (top 4)</span>
        <span><i style="background:var(--rel)"></i> Relegation (bottom 3)</span>
      </div>`;
  }

  /* ---------- team sheet ---------- */

  function favLine(team) {
    const name = favOf(team);
    if (!name) return "";
    const p = (SQUADS[team] || []).find(x => x[0] === name);
    if (!p) return "";
    return `<span class="fav-chip">♥ ${p[0]} · ${p[2]} · ${p[1] ? "#" + p[1] : "no number"}</span>`;
  }

  function toggleFav(team, name) {
    return Store.update(s => {
      if (s.favPlayers[team] === name) delete s.favPlayers[team];
      else s.favPlayers[team] = name;
    });
  }

  function playerTiles(team) {
    const fav = favOf(team);
    return (SQUADS[team] || []).map(([name, num, pos, dob, country]) => {
      const on = fav === name;
      const age = ageFrom(dob);
      return `
      <div class="p-tile${on ? " is-fav" : ""}">
        <span class="p-num">${num === null ? "–" : num}</span>
        <span class="p-pos ${pos}">${pos}</span>
        <button class="p-fav${on ? " on" : ""}" data-fav="${name}" aria-pressed="${on}"
                aria-label="${on ? "Remove" : "Make"} ${name} your favourite ${team} player">${on ? "♥" : "♡"}</button>
        <div class="p-name">${name}</div>
        <div class="p-meta">${age !== null ? age + " yrs · " + dob : "DOB unknown"}</div>
        <div class="p-country">${country === "Unknown" ? "Country unknown" : country}</div>
      </div>`;
    }).join("");
  }

  function openTeamSheet(team) {
    const squad = SQUADS[team];
    if (!squad) return;
    const row = teamRow(team);
    const standTile = `
      <div class="stand-tile">
        <div class="al">League position · ${(() => { const i = table().findIndex(r => r.team === team); return i + 1; })()}</div>
        <div class="stand-nums">
          <span><b>${row.p}</b>P</span><span><b>${row.w}</b>W</span><span><b>${row.d}</b>D</span>
          <span><b>${row.l}</b>L</span><span><b>${row.gf}</b>GF</span><span><b>${row.ga}</b>GA</span>
          <span class="pts"><b>${row.pts}</b>Pts</span>
        </div>
      </div>`;
    const results = teamResults(team);
    const resTile = results.length ? `
      <div class="stand-tile">
        <div class="al">Results so far</div>
        ${results.map(r => `<div class="res-line">
          <span class="r">MD${r.md} · ${r.venue}</span>
          <span class="o">${r.won === true ? "beat" : (r.won === false ? "lost to" : "drew with")} ${r.opponent}</span>
          <span class="s ${r.won === true ? "w" : (r.won === false ? "l" : "")}">${r.score}</span>
        </div>`).join("")}
      </div>` : "";

    const scrim = document.createElement("div");
    scrim.className = "sheet-scrim";
    scrim.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${team} squad">
        <div class="grabber"></div>
        <h2>${team}</h2>
        <p class="host">${squad.length}-player squad</p>
        <div id="favLine">${favLine(team)}</div>
        ${standTile}${resTile}
        <p class="grp-legend" style="margin:14px 0 6px">Tap ♡ to pick your favourite — one per club.</p>
        <div class="p-grid" id="pGrid">${playerTiles(team)}</div>
        <button class="btn btn-ghost" data-close>Close</button>
      </div>`;

    const close = () => { scrim.remove(); document.body.style.overflow = ""; };
    scrim.addEventListener("click", e => {
      const heart = e.target.closest("[data-fav]");
      if (heart) {
        toggleFav(team, heart.dataset.fav).then(() => {
          scrim.querySelector("#pGrid").innerHTML = playerTiles(team);
          scrim.querySelector("#favLine").innerHTML = favLine(team);
          const q = $("#teamSearch");
          if (q && q.value) renderSearch(q.value);
          renderTable();      // favourite-heart marker next to the club name
        });
        return;
      }
      if (e.target === scrim || e.target.hasAttribute("data-close")) close();
    });
    document.addEventListener("keydown", function esc(e) {
      if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); }
    });
    document.body.style.overflow = "hidden";
    document.body.appendChild(scrim);
  }

  /* ---------- goalscorer picker sheet ---------- */

  function openPickerSheet(fi, side) {
    const f = FIXTURES[fi];
    const team = side === "h" ? f.h : f.a;
    const squad = SQUADS[team] || [];

    const scrim = document.createElement("div");
    scrim.className = "sheet-scrim";
    const list = (q) => {
      const n = normalise(q || "");
      return squad.filter(p => !n || normalise(p[0]).includes(n));
    };
    scrim.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Pick a ${team} goalscorer">
        <div class="grabber"></div>
        <h2 style="font-size:20px">Who scored for ${team}?</h2>
        <div class="search-wrap" style="margin-top:10px">
          <input class="search" id="pickerSearch" type="search" autocomplete="off" placeholder="Search player…">
        </div>
        <div class="pick-list" id="pickerList">
          ${list().map(p => `<button class="pick-row" data-pick-name="${p[0]}">
              <span class="num">${p[1] === null ? "–" : p[1]}</span> ${p[0]}</button>`).join("")}
        </div>
        <button class="btn btn-ghost" data-close>Cancel</button>
      </div>`;

    const close = () => { scrim.remove(); document.body.style.overflow = ""; };
    scrim.querySelector("#pickerSearch").addEventListener("input", e => {
      scrim.querySelector("#pickerList").innerHTML =
        list(e.target.value).map(p => `<button class="pick-row" data-pick-name="${p[0]}">
            <span class="num">${p[1] === null ? "–" : p[1]}</span> ${p[0]}</button>`).join("");
    });
    scrim.addEventListener("click", e => {
      const row = e.target.closest("[data-pick-name]");
      if (row) {
        addScorer(fi, side, row.dataset.pickName).then(() => { close(); renderFixtures(); });
        return;
      }
      if (e.target === scrim || e.target.hasAttribute("data-close")) close();
    });
    document.body.style.overflow = "hidden";
    document.body.appendChild(scrim);
  }

  /* ---------- country/team search ---------- */

  function teamSummary(team) {
    const row = teamRow(team);
    const pos = table().findIndex(r => r.team === team) + 1;
    return `Pos ${pos} · ${row.pts} pt${row.pts === 1 ? "" : "s"} · ${row.p} played`;
  }

  function renderSearch(query) {
    const box = $("#searchResults");
    const q = normalise(query || "");
    if (!q) { box.innerHTML = ""; return; }
    const hits = TEAMS.filter(t => normalise(t).includes(q)).slice(0, 8);
    if (!hits.length) { box.innerHTML = `<p class="empty" style="padding:18px">No club matches "${query}".</p>`; return; }
    box.innerHTML = `<div class="sim-hits">${hits.map(t => `
      <button class="sim-hit" data-team="${t}">
        <span class="crest">🛡️</span>
        <span class="hit-main"><span class="hit-name">${t}</span>
          <span class="hit-sub">${teamSummary(t)}</span>
          ${favLine(t) ? `<span class="hit-fav">${favLine(t)}</span>` : ""}</span>
        <span class="wc-caret" aria-hidden="true">›</span>
      </button>`).join("")}</div>`;
  }

  /* ---------- wiring ---------- */

  function init() {
    renderFixtures();
    renderTable();

    $("#teamSearch").addEventListener("input", e => renderSearch(e.target.value));
    $("#searchResults").addEventListener("click", e => {
      const hit = e.target.closest("[data-team]");
      if (hit) openTeamSheet(hit.dataset.team);
    });

    $("#mdChips").addEventListener("click", e => {
      const chip = e.target.closest("[data-md]");
      if (!chip) return;
      md = Number(chip.dataset.md);
      renderFixtures();
    });

    $("#fixtureList").addEventListener("click", e => {
      const teamBtn = e.target.closest("[data-team]");
      if (teamBtn) { openTeamSheet(teamBtn.dataset.team); return; }

      const pick = e.target.closest("[data-pick]");
      if (pick) { openPickerSheet(Number(pick.dataset.fi), pick.dataset.pick); return; }

      const rm = e.target.closest("[data-rm]");
      if (rm) { removeScorer(Number(rm.dataset.fi), Number(rm.dataset.rm)).then(renderFixtures); return; }

      const save = e.target.closest("[data-save]");
      if (save) { saveScore(Number(save.dataset.save)); return; }
    });

    $("#fixtureList").addEventListener("input", e => {
      const el = e.target.closest(".sc");
      if (!el) return;
      setScore(Number(el.dataset.fi), el.dataset.side, el.value).then(() => {
        const btn = document.querySelector(`[data-save="${el.dataset.fi}"]`);
        if (btn) {
          const r = res()[el.dataset.fi];
          btn.disabled = !(r && r.hs !== null && r.as !== null);
        }
      });
    });

    $("#tableBody").addEventListener("click", e => {
      const teamBtn = e.target.closest("[data-team]");
      if (teamBtn) openTeamSheet(teamBtn.dataset.team);
    });

    $("#resetBtn").addEventListener("click", () => {
      if (!confirm("Reset the whole season? Every score and goalscorer will be lost. Favourites are kept.")) return;
      Store.update(s => { s.results = {}; }).then(() => { md = 1; renderFixtures(); renderTable(); });
    });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) renderFixtures(); });
  }

  return { init, renderFixtures, renderTable, table, teamRow, isPlayed, isLocked, lockRemaining,
           fixturesFor, renderSearch, teamSummary, favOf, toggleFav, playerTiles, favLine, teamResults };
})();


/* ==================================================================
   E. ROUTER & BOOT
   ================================================================== */
function showView(name) {
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + name; });
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === name)));
  window.scrollTo(0, 0);
  location.hash = name;
  if (name === "table") Season.renderTable();
}

document.querySelector(".tabbar").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (btn) showView(btn.dataset.view);
});

const VIEWS = ["fixtures", "table"];

(async function boot() {
  await Store.init();
  Season.init();
  Updater.init();
  const wanted = location.hash.replace("#", "");
  showView(VIEWS.includes(wanted) ? wanted : "fixtures");
})();


/* ==================================================================
   F. UPDATER — same self-update pattern as the companion app
   ================================================================== */
const APP_VERSION = "2026.11.01.1312";

const Updater = (function () {
  let lastCheck = 0;
  const MIN_GAP = 5 * 60 * 1000;

  function show(version) {
    const bar = document.getElementById("updateBar");
    if (!bar || !bar.hidden) return;
    bar.hidden = false;
    document.getElementById("updateBtn").onclick = () => {
      location.replace(location.pathname + "?v=" + encodeURIComponent(version));
    };
    document.getElementById("updateDismiss").onclick = () => { bar.hidden = true; };
  }

  async function check(force) {
    const now = Date.now();
    if (!force && now - lastCheck < MIN_GAP) return;
    lastCheck = now;
    try {
      const res = await fetch("version.json?t=" + now, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.version && data.version !== APP_VERSION) show(data.version);
    } catch (e) { /* offline or blocked — stay quiet */ }
  }

  function init() {
    check();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  }

  return { init, check, APP_VERSION };
})();
</script>
</body>
</html>
